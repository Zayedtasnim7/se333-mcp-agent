name: Validate Submission Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required submission files
        id: check
        run: |
          missing=""
          if [ ! -f ".github/prompts/tester.prompt.md" ]; then
            missing=".github/prompts/tester.prompt.md"
          fi
          if [ ! -f "docs/reflection.pdf" ]; then
            if [ -z "$missing" ]; then
              missing="docs/reflection.pdf"
            else
              missing="$missing, docs/reflection.pdf"
            fi
          fi
          echo "missing_files=$missing" >> $GITHUB_OUTPUT

      - name: Comment on PR if artifacts missing
        if: steps.check.outputs.missing_files != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const missing = `${{ steps.check.outputs.missing_files }}`.trim();
            const body = `:warning: Submission artifacts are missing: **${missing}**\n\nPlease add the missing files before final submission.\n\n- \.github/prompts/tester.prompt.md (MCP agent prompt)\n- docs/reflection.pdf (2-page reflection PDF compiled from docs/reflection.tex)\n\nIf you want this check to fail the CI instead of commenting, edit .github/workflows/validate-submission.yml and change the behavior.`;
            await github.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
