name: Enforce Submission Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enforce-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required submission files
        run: |
          missing=0
          if [ ! -f ".github/prompts/tester.prompt.md" ]; then
            echo "Missing: .github/prompts/tester.prompt.md"
            missing=1
          fi
          if [ ! -f "docs/reflection.pdf" ]; then
            echo "Missing: docs/reflection.pdf"
            missing=1
          fi
          if [ $missing -ne 0 ]; then
            echo "Required submission artifacts missing. Failing workflow." >&2
            exit 1
          fi
